
workflows:
  mutqin-android:
    name: Mutqin Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 22
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Configure Capacitor
        script: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mutqin.quran",
            "appName": "مُتقِن",
            "webDir": "dist"
          }
          EOF

      - name: Build web application
        script: |
          npm run build

      - name: Add Android platform
        script: |
          npx cap add android

      - name: Sync web assets to Android
        script: |
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - pppllkkoo68@gmail.com
        notify:
          success: true
          failure: true
