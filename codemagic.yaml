
workflows:
  mutqin-android:
    name: Mutqin Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 22
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Verify project files
        script: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          test -f package.json
          test -f index.html

      - name: Configure Capacitor
        script: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mutqin.quran",
            "appName": "مُتقِن",
            "webDir": "dist"
          }
          EOF

      - name: Build web application
        script: |
          npm run build
          echo "Checking generated web files:"
          ls -la dist
          test -f dist/index.html

      - name: Add Android platform
        script: |
          npx cap add android

      - name: Sync web assets to Android
        script: |
          npx cap sync android

      - name: Add microphone permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          for permission in permissions:
              entry = f'<uses-permission android:name="{permission}" />'
              if permission not in content:
                  content = content.replace(
                      "<application",
                      f"    {entry}\n    <application",
                      1
                  )

          manifest.write_text(content)
          print("Microphone permissions configured.")
          PY

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - pppllkkoo68@gmail.com
        notify:
          success: true
          failure: true
